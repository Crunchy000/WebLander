# Flatpak build for the WebLander desktop app.
#
# It does not compile anything: it unpacks the .deb that `tauri build` already
# produced. Building the Rust crate a second time inside flatpak-builder would
# mean vendoring the whole cargo tree, and would give a binary no different
# from the one the release already ships.
#
#   npm run desktop:build
#   cp ../src-tauri/target/release/bundle/deb/*.deb weblander.deb
#   flatpak-builder --force-clean --user --install build-dir io.github.crunchy000.WebLander.yml
#   flatpak run io.github.crunchy000.WebLander
#
# The GNOME runtime is what supplies WebKitGTK 4.1, which is the webview Tauri
# links against; that is the whole reason for choosing it over the freedesktop
# runtime, which has no webview at all.
id: io.github.crunchy000.WebLander

runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk

command: weblander

finish-args:
  - --socket=wayland
  - --socket=fallback-x11       # still the common case on older desktops
  - --share=ipc
  - --device=dri                # WebGL; without it the game is a black window
  - --device=input              # gamepads, read through libmanette
  - --socket=pulseaudio         # the engine, the rain and the thunder

modules:
  - name: weblander
    buildsystem: simple

    sources:
      - type: file
        path: weblander.deb
      - type: file
        path: io.github.crunchy000.WebLander.desktop
      - type: file
        path: io.github.crunchy000.WebLander.metainfo.xml

    build-commands:
      - mkdir -p deb-extract
      - ar -x weblander.deb --output deb-extract
      - tar -C deb-extract -xf deb-extract/data.tar.gz

      - install -Dm755 deb-extract/usr/bin/weblander /app/bin/weblander

      # Every icon size the .deb carries, renamed to the app id -- which is
      # what the desktop file points at and what flatpak expects to find.
      # The bundler also emits a "256x256@2" directory, which is not a name
      # the icon theme spec knows; it is skipped, and 512x512 covers it.
      - |
        set -e
        for dir in deb-extract/usr/share/icons/hicolor/*/apps; do
          size=$(basename "$(dirname "$dir")")
          case "$size" in *@*) continue ;; esac
          install -Dm644 "$dir/weblander.png" \
            "/app/share/icons/hicolor/$size/apps/io.github.crunchy000.WebLander.png"
        done

      # Our own desktop entry rather than the one in the .deb, so the Icon=
      # line is the app id from the start and there is nothing to patch.
      - install -Dm644 io.github.crunchy000.WebLander.desktop
          /app/share/applications/io.github.crunchy000.WebLander.desktop
      - install -Dm644 io.github.crunchy000.WebLander.metainfo.xml
          /app/share/metainfo/io.github.crunchy000.WebLander.metainfo.xml
