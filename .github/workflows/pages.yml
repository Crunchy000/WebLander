name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege that still lets deploy-pages mint its OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify modules load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # There is no build step -- the game is served as-is -- so the useful
      # check is that every module still parses and evaluates. Each one is
      # imported for real, which catches syntax errors, bad import paths and
      # anything that throws at module scope before it reaches the site.
      #
      # The list is read off the directory rather than written out here. It
      # used to be written out here, and it went stale the first time a file
      # was renamed: it still named lanterns.js after that became lilies.js,
      # which failed the build, and it had never named flowers.js, bird.js or
      # either origami file at all -- so four modules were shipping unchecked.
      # main.js is skipped: it touches the DOM as soon as it loads.
      - name: Import every module
        run: |
          node --input-type=module -e '
            import { readdir } from "fs/promises";
            const mods = (await readdir("./js"))
              .filter((f) => f.endsWith(".js") && f !== "main.js")
              .sort();
            let failed = false;
            for (const m of mods) {
              try {
                await import("./js/" + m);
                console.log("  ok   js/" + m);
              } catch (err) {
                console.error("  FAIL js/" + m + " -- " + err.message);
                failed = true;
              }
            }
            if (failed) process.exit(1);
            console.log("\nall " + mods.length + " modules loaded");
          '

      - name: Check entry points exist
        run: |
          for f in index.html css/style.css js/main.js; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          echo "entry points present"

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # enablement: true turns Pages on for the repo if it is not already,
      # so this works without anyone visiting the settings page first.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The repository holds more than the game -- workflows, a README, the
      # scripts themselves -- and none of that belongs on the site.
      - name: Stage the site
        run: node scripts/assemble-web.mjs _site

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
