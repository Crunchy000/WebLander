[package]
name = "weblander"
version = "1.0.0"
description = "Fly a drone over an endless landscape. A tribute to the 1987 Archimedes classic."
authors = ["Matt Churcher"]
license = "MIT"
repository = "https://github.com/Crunchy000/WebLander"
edition = "2021"
rust-version = "1.77.2"

# The game is the web build, unchanged; this crate only puts a window round it.
# Nothing here is imported by the browser version, and nothing in js/ knows it
# exists, so the two can never drift apart in behaviour.

[lib]
name = "weblander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
